<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Tombola Dictée — Écran Projecteur</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#050d1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;position:relative}

/* FOND ANIMÉ */
.bg-stars{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) infinite ease-in-out var(--del,0s)}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.7;transform:scale(1.4)}}

/* LOGO / TITRE EVENT */
.event-header{position:fixed;top:32px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
.event-title{font-size:1.1rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#60a5fa;opacity:.7}

/* ÉCRAN ATTENTE */
#screen-waiting{position:relative;z-index:10;text-align:center;padding:40px}
.waiting-icon{font-size:6rem;margin-bottom:24px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.waiting-title{font-size:2.8rem;font-weight:900;color:#fff;margin-bottom:12px;letter-spacing:-1px}
.waiting-sub{font-size:1.1rem;color:#334155;letter-spacing:1px}

/* ÉCRAN GAGNANT */
#screen-winner{position:relative;z-index:10;text-align:center;padding:40px;display:none;width:100%;max-width:1100px}

/* Confetti */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:5}
.confetti-piece{position:absolute;width:12px;height:12px;top:-20px;animation:fall var(--dur,3s) ease-in var(--del,0s) forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(.5);opacity:0}}

/* Badge "félicitations" */
.congrats-badge{display:inline-block;background:linear-gradient(135deg,#d97706,#f59e0b);color:#000;font-size:0.85rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;padding:8px 28px;border-radius:40px;margin-bottom:28px;animation:popIn .4s ease}

/* Nom */
.winner-name-big{font-size:5.5rem;font-weight:900;line-height:1.05;letter-spacing:-3px;color:#fff;margin-bottom:16px;animation:slideUp .5s ease;text-shadow:0 0 60px #3b82f680}
@media(max-width:900px){.winner-name-big{font-size:3.2rem;letter-spacing:-1px}}

/* Établissement */
.winner-etab-big{font-size:1.6rem;color:#60a5fa;font-weight:600;margin-bottom:32px;animation:slideUp .5s ease .1s both}

/* Numéro */
.winner-counter{font-size:1rem;color:#334155;font-weight:600;letter-spacing:1px;animation:fadeIn .5s ease .3s both}

/* Barre de progression marques */
.brands-bar{position:fixed;bottom:0;left:0;right:0;background:#0b1120cc;backdrop-filter:blur(10px);border-top:1px solid #1e293b;padding:14px 40px;display:flex;gap:16px;align-items:center;overflow-x:auto;z-index:10}
.brands-bar-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#334155;white-space:nowrap;margin-right:4px}
.brand-pill{display:flex;align-items:center;gap:8px;background:#111827;border:1px solid #1e293b;border-radius:10px;padding:8px 14px;white-space:nowrap;transition:all .4s}
.brand-pill.done{opacity:.3;text-decoration:line-through;filter:grayscale(1)}
.brand-pill-name{font-size:0.8rem;font-weight:700}
.brand-pill-count{font-size:0.8rem;font-weight:800;padding:2px 8px;border-radius:6px;background:#0b1120}
.brand-pill-count.low{color:#ef4444}
.brand-pill-count.ok{color:#f59e0b}
.brand-pill-count.fresh{color:#4ade80}

/* Animations */
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #f59e0b40}50%{box-shadow:0 0 0 20px #f59e0b00}}
</style>
</head>
<body>

<!-- Étoiles fond -->
<div class="bg-stars" id="bg-stars"></div>

<!-- Confettis -->
<div class="confetti-wrap" id="confetti-wrap"></div>

<!-- Header event -->
<div class="event-header">
  <div class="event-title">✏️ La Dictée — Tombola</div>
</div>

<!-- ÉCRAN ATTENTE -->
<div id="screen-waiting">
  <div class="waiting-icon">🎰</div>
  <div class="waiting-title">Le tirage commence bientôt…</div>
  <div class="waiting-sub">EN ATTENTE DU PROCHAIN GAGNANT</div>
</div>

<!-- ÉCRAN GAGNANT -->
<div id="screen-winner">
  <div class="congrats-badge">🎉 Félicitations !</div>
  <div class="winner-name-big" id="fw-name">—</div>
  <div class="winner-etab-big" id="fw-etab">—</div>
  <div class="winner-counter" id="fw-counter"></div>
</div>

<!-- Barre marques en bas -->
<div class="brands-bar" id="brands-bar">
  <span class="brands-bar-label">Marques</span>
  <span id="brands-bar-items" style="display:flex;gap:10px;flex-wrap:nowrap">—</span>
</div>

<script>
// ================================================
// GÉNÉRATION DES ÉTOILES DE FOND
// ================================================
const starsEl = document.getElementById('bg-stars');
for(let i=0;i<120;i++){
  const s=document.createElement('div');
  s.className='star';
  const size=Math.random()*3+1;
  s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--del:${Math.random()*4}s`;
  starsEl.appendChild(s);
}

// ================================================
// CONFETTIS
// ================================================
const COLORS=['#f59e0b','#3b82f6','#ec4899','#10b981','#f97316','#8b5cf6','#fff'];
function launchConfetti(){
  const wrap=document.getElementById('confetti-wrap');
  wrap.innerHTML='';
  for(let i=0;i<80;i++){
    const c=document.createElement('div');
    c.className='confetti-piece';
    const color=COLORS[Math.floor(Math.random()*COLORS.length)];
    const isCircle=Math.random()>.5;
    c.style.cssText=`
      left:${Math.random()*100}%;
      background:${color};
      border-radius:${isCircle?'50%':'2px'};
      width:${8+Math.random()*10}px;
      height:${8+Math.random()*10}px;
      --dur:${2+Math.random()*2.5}s;
      --del:${Math.random()*1.2}s;
    `;
    wrap.appendChild(c);
  }
  setTimeout(()=>wrap.innerHTML='', 5000);
}

// ================================================
// LIRE L'ÉTAT DEPUIS LE BO (localStorage)
// ================================================
const NIV_LABELS={
  maternelle:'Maternelle',primaire:'Primaire',
  college:'Collège',lycee:'Lycée',
  superieur:'Supérieur',tous:'Tous'
};

let lastEventId = null;

function readState(){
  try{
    const ev = JSON.parse(localStorage.getItem('tombola_live_event')||'null');
    if(!ev) return;
    if(ev.id === lastEventId) return; // déjà affiché
    lastEventId = ev.id;

    if(ev.type==='winner'){
      showWinner(ev);
    } else if(ev.type==='reset'){
      showWaiting();
    }

    // Toujours mettre à jour la barre des marques
    updateBrandsBar(ev.brandStates||[]);
  } catch(e){}
}

function showWinner(ev){
  // Basculer les écrans
  document.getElementById('screen-waiting').style.display='none';
  const sw=document.getElementById('screen-winner');
  sw.style.display='block';

  // Contenu
  document.getElementById('fw-name').textContent = ev.winner.nom;
  document.getElementById('fw-etab').textContent = ev.winner.etablissement||'';
  document.getElementById('fw-counter').textContent =
    `${ev.totalDone} cadeau${ev.totalDone>1?'x':''} distribué${ev.totalDone>1?'s':''} sur ${ev.totalMax}`;

  // Relancer les animations CSS (force reflow)
  sw.querySelectorAll('[class]').forEach(el=>{
    el.style.animation='none';
    void el.offsetWidth;
    el.style.animation='';
  });

  launchConfetti();
}

function showWaiting(){
  document.getElementById('screen-winner').style.display='none';
  document.getElementById('screen-waiting').style.display='block';
}

function updateBrandsBar(brandStates){
  const container = document.getElementById('brands-bar-items');
  if(!brandStates.length){ container.innerHTML='<span style="color:#334155;font-size:0.8rem">En attente de configuration…</span>'; return; }
  container.innerHTML = brandStates.map(bs=>{
    const done = bs.remaining===0;
    const low = bs.remaining>0 && bs.remaining<=3;
    const cls = done?'done':'';
    const numCls = done?'':'(bs.remaining<=3?"low":"fresh")';
    const colorClass = done?'':'(bs.remaining<=3?"low":"fresh")';
    return `<div class="brand-pill ${done?'done':''}">
      <span class="brand-pill-name">${bs.name}</span>
      <span class="brand-pill-count ${done?'':bs.remaining<=3?'low':'fresh'}">${bs.remaining}</span>
    </div>`;
  }).join('');
}

// Polling toutes les 500ms (même onglet ou onglets différents)
setInterval(readState, 500);
readState();

// Écoute les changements de localStorage (autre onglet)
window.addEventListener('storage', e=>{
  if(e.key==='tombola_live_event') readState();
});
</script>
</body>
</html>
